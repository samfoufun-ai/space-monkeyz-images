name: Build personality images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "personalities.csv"
      - "scripts/build_personality_images.py"
      - ".github/workflows/build-personality-images.yml"

concurrency:
  group: build-personality-images
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download and normalize images
        run: python scripts/build_personality_images.py
      - name: Commit generated image bank
        run: |
          git config user.name "space-monkeyz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add personalities manifest.csv failed.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build personality image bank"
            git push
          fi
